<!-- ===================== GATE: setup / login ===================== -->
<div id="gate">
  <div class="wrap">
    <div class="mark">R</div>
    <div id="gateBody"></div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">

  <!-- ---------- BERANDA ---------- -->
  <section class="screen" id="s-home">
    <div class="topbar">
      <div>
        <h1 id="greet">Halo</h1>
        <div class="sub" id="todayStr"></div>
      </div>
      <div class="topbar-actions">
        <button class="iconbtn" id="syncBtn" title="Sinkron">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-9 9 9 9 0 0 1-7.6-4.2"/><path d="M3 12a9 9 0 0 1 9-9 9 9 0 0 1 7.6 4.2"/><polyline points="21 3 21 8 16 8"/><polyline points="3 21 3 16 8 16"/></svg>
        </button>
        <button class="iconbtn" id="themeBtn" title="Tema">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" id="themeIcon"></svg>
        </button>
        <button class="iconbtn" data-sheet="settings" title="Pengaturan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10.6 3.09V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 16.11 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 20.43 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </div>
    <div id="homeBody"></div>
  </section>

  <!-- ---------- HARIAN ---------- -->
  <section class="screen" id="s-day">
    <div class="topbar">
      <div><h1>Harian</h1><div class="sub" id="dayDateLbl"></div></div>
      <div class="topbar-actions">
        <button class="iconbtn" id="dayPrev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
        <button class="iconbtn" id="dayToday"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg></button>
        <button class="iconbtn" id="dayNext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
      </div>
    </div>
    <div id="dayBody"></div>
  </section>

  <!-- ---------- UANG ---------- -->
  <section class="screen" id="s-money">
    <div class="topbar">
      <div><h1>Uang</h1><div class="sub" id="moneyMonthLbl"></div></div>
      <div class="topbar-actions">
        <button class="iconbtn" id="mPrev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
        <button class="iconbtn" id="mNext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
      </div>
    </div>
    <div id="moneyBody"></div>
  </section>

  <!-- ---------- PROGRES ---------- -->
  <section class="screen" id="s-prog">
    <div class="topbar">
      <div><h1>Progres</h1><div class="sub" id="progSub">skripsi · kerja · badan</div></div>
    </div>
    <div class="seg" id="progSeg" style="margin-bottom:16px">
      <button data-p="latihan" class="on">Latihan</button>
      <button data-p="skripsi">Skripsi</button>
      <button data-p="kerja">Kerja</button>
      <button data-p="badan">Badan</button>
    </div>
    <div id="progBody"></div>
  </section>

  <!-- ---------- IDE ---------- -->
  <section class="screen" id="s-idea">
    <div class="topbar">
      <div><h1>Ide</h1><div class="sub" id="ideaSub">gudang ide konten</div></div>
      <div class="topbar-actions">
        <button class="iconbtn" data-sheet="idea"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
      </div>
    </div>
    <div id="ideaBody"></div>
  </section>

  <button class="fab ai" id="aiFab" aria-label="Asisten">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2l1.9 4.6 4.6 1.9-4.6 1.9L12 16.2l-1.9-4.6L5.5 9.7l4.6-1.9L12 3.2Z"/><path d="M18.5 15.4l.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8.8-1.9Z"/></svg>
  </button>
  <button class="fab" id="fab" aria-label="Tambah">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <nav class="tabbar">
    <button class="tab on" data-go="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.6V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.6"/></svg>
      <span>Beranda</span>
    </button>
    <button class="tab" data-go="day">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><line x1="3" y1="9.5" x2="21" y2="9.5"/><line x1="8" y1="2.5" x2="8" y2="6"/><line x1="16" y1="2.5" x2="16" y2="6"/><path d="M8 14h3"/><path d="M8 17.5h7"/></svg>
      <span>Harian</span>
    </button>
    <button class="tab" data-go="money">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="3"/><path d="M2.5 10.5h19"/><path d="M6.5 15h3"/></svg>
      <span>Uang</span>
    </button>
    <button class="tab" data-go="prog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
      <span>Progres</span>
    </button>
    <button class="tab" data-go="idea">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 21.5h4"/><path d="M12 2.5a6.5 6.5 0 0 0-4 11.6c.6.5 1 1.2 1 2h6c0-.8.4-1.5 1-2a6.5 6.5 0 0 0-4-11.6Z"/></svg>
      <span>Ide</span>
    </button>
  </nav>
</div>

<!-- ===================== SESI LATIHAN ===================== -->
<div id="ses">
  <header class="aiTop">
    <button class="iconbtn" id="sesTutup" aria-label="Tutup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="grow" style="min-width:0">
      <div id="sesJudul" style="font-weight:750;font-size:15px;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div>
      <div class="xs dim" id="sesSub"></div>
    </div>
  </header>
  <div class="sesbar"><i id="sesRing"></i></div>
  <div id="sesLog"></div>
  <div class="istbar" id="istBar">
    <div class="istfill" id="istIsi"></div>
    <span class="istlbl">Istirahat</span>
    <span class="tnum" id="istWaktu" style="font-weight:800;font-size:17px">0:00</span>
    <button class="chip" id="istLewati">Lewati</button>
  </div>
</div>

<!-- ===================== ASISTEN ===================== -->
<div id="ai">
  <header class="aiTop">
    <button class="iconbtn" id="aiClose" aria-label="Tutup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="grow" style="text-align:center">
      <div style="font-weight:750;font-size:15px;letter-spacing:-.02em">Asisten</div>
      <div class="xs dim" id="aiSub">catat & tanya pakai bahasa biasa</div>
    </div>
    <button class="iconbtn" id="aiReset" aria-label="Obrolan baru">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v6h6"/><path d="M20 20v-6h-6"/><path d="M20 9a8 8 0 0 0-14.1-3.4L4 10"/><path d="M4 15a8 8 0 0 0 14.1 3.4L20 14"/></svg>
    </button>
    <button class="iconbtn" id="aiGear" aria-label="Pengaturan asisten">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10.6 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1.51 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 20.43 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>
  <div id="aiLog"></div>
  <div class="aiBar" id="aiBar">
    <textarea id="aiText" rows="1" placeholder="Tadi jajan 25rb…" enterkeyhint="send"></textarea>
    <button id="aiSend" aria-label="Kirim">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12h13"/><path d="M12.5 6.5 18.5 12l-6 5.5"/></svg>
    </button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div id="toast"></div>
