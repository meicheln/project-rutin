name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # ubuntu-latest pindah ke Ubuntu 26.04 Oktober 2026 dan Playwright 1.56 nolak
    # jalan di situ ('does not support chromium on ubuntu26.04-x64'). Dipaku ke 24.04
    # sampai Playwright-nya dukung — naikin balik ke -latest begitu udah.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Test
        run: node tests/jalan.mjs

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: rutin-html
          path: dist/rutin.html
